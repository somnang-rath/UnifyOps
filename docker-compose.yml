name: prism

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping: the API reaches Redis over the compose network as
    # redis:6379. Exposing 6379 on the host conflicts with any local Redis.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/prism}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Shared server-to-server secret for the internal wiki endpoints the live
      # server calls. Required by the api env schema; MUST match the live service.
      LIVE_INTERNAL_TOKEN: ${LIVE_INTERNAL_TOKEN}
      # Enable open sign-up for first-run bootstrap; an instance admin can later
      # disable it. Defaults off (invite-only) when unset.
      ALLOW_PUBLIC_REGISTER: ${ALLOW_PUBLIC_REGISTER:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "4000:4000"
    volumes:
      - api-uploads:/app/uploads

  live:
    build:
      context: .
      dockerfile: apps/live/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3100
      # These three MUST match the api service exactly.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/prism}
      LIVE_INTERNAL_TOKEN: ${LIVE_INTERNAL_TOKEN}
      # live → api over the compose network for auth + snapshot-back.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:4000/api/v1}
      LIVE_ALLOWED_ORIGINS: ${LIVE_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002}
    ports:
      - "3100:3100"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* values are baked into the JS bundle at build time.
        # Set these to the URLs the *browser* will hit (not docker network names).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        # Live collaboration server — the wiki editor connects here. Absolute ws://
        # URL; WebSocket upgrades bypass the Next.js proxy.
        NEXT_PUBLIC_LIVE_URL: ${NEXT_PUBLIC_LIVE_URL:-ws://localhost:3100}
        # Public Space app — builds the wiki "Publish to Space" share link.
        NEXT_PUBLIC_SPACE_URL: ${NEXT_PUBLIC_SPACE_URL:-http://localhost:3002}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side refresh proxy hits the API over the docker network
      API_URL: ${API_URL:-http://api:4000/api/v1}
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # Baked into the Next rewrite proxy at build time (routes-manifest).
        API_URL: ${API_URL:-http://api:4000/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"

  space:
    build:
      context: .
      dockerfile: apps/space/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      # SSR fetches the public endpoints over the docker network.
      API_URL: ${API_URL:-http://api:4000/api/v1}
    ports:
      - "3002:3002"

volumes:
  mongo-data:
  redis-data:
  api-uploads:
