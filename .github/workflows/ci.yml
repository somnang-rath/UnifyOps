name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: e2e · en + km
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # §13: every end-to-end flow runs in both languages, from slice 4 onward.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tenancy:
    name: tenancy · cross-workspace reads return zero rows
    runs-on: ubuntu-latest
    # §16 names a tenancy leak "the failure that ends the product". This job is
    # the gate that proves RLS actually holds, and it runs against a real
    # Postgres provisioned by Testcontainers — the same harness a developer
    # gets locally, so a pass here means the same thing it means on a laptop.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docker is present on ubuntu-latest; the suite provisions its own
      # database, roles and grants, and applies drizzle/ as the owner role.
      - run: pnpm test:tenancy
