name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: e2e · en + km
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # §13: every end-to-end flow runs in both languages, from slice 4 onward.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tenancy:
    name: tenancy · cross-workspace reads return zero rows
    runs-on: ubuntu-latest
    # §16 names a tenancy leak "the failure that ends the product". This job
    # exists from slice 1 and is the gate that proves RLS actually holds.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: unifyops_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip until slice 1 lands the schema
        id: guard
        run: |
          if [ -f src/server/db/schema/index.ts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No schema yet — tenancy suite is inert until slice 1."
          fi
      - if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/unifyops_test
        run: pnpm db:migrate
      - if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/unifyops_test
          DATABASE_URL: postgresql://unifyops_app:postgres@localhost:5432/unifyops_test
        run: pnpm test:tenancy
